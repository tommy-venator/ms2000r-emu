name: Build macOS VST3

on:
  push:
    branches: [ fix/plugin-program-recall ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Diagnose intrin.h usage
        run: |
          grep -rn "intrin.h" external/dsp56300/source/dsp56kEmu | head -20 || true
          sed -n 1,15p external/dsp56300/source/dsp56kEmu/utils.h || true

      - name: Create intrin.h stand-in for macOS
        run: |
          mkdir -p "$GITHUB_WORKSPACE/shim"
          cat > "$GITHUB_WORKSPACE/shim/intrin.h" <<'EOF'
          #pragma once
          #if defined(__x86_64__) || defined(__i386__)
          #include <x86intrin.h>
          #endif
          #ifndef _ReturnAddress
          #define _ReturnAddress() __builtin_return_address(0)
          #endif
          EOF
          cat "$GITHUB_WORKSPACE/shim/intrin.h"

      - name: Configure
        run: |
          cmake -S . -B build_vst -DCMAKE_BUILD_TYPE=Release -DMS2K_BUILD_VST3=ON \
            -DCMAKE_CXX_FLAGS="-I$GITHUB_WORKSPACE/shim" \
            -DCMAKE_C_FLAGS="-I$GITHUB_WORKSPACE/shim"

      - name: Find plugin target
        id: tgt
        run: |
          name=$(cmake --build build_vst --target help | grep -o '[A-Za-z0-9_]*_VST3' | head -1)
          echo "Target: $name"
          [ -n "$name" ] || { echo "No *_VST3 target found"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cmake --build build_vst --config Release --target ${{ steps.tgt.outputs.name }} --parallel -- -k 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0

      - name: Show first errors
        if: failure()
        run: grep -n "error:" build.log | head -30 || true

      - name: Package .vst3
        run: |
          bundle=$(find build_vst -type d -name "*.vst3" | head -1)
          [ -n "$bundle" ] || { echo "No .vst3 bundle found"; exit 1; }
          mkdir -p out
          ditto -c -k --keepParent "$bundle" "out/MS2000R-vst3-macos-arm64.zip"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: MS2000R-VST3-macOS-arm64
          path: out
          if-no-files-found: error
