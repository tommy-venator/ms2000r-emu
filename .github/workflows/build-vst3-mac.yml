name: Build macOS VST3

on:
  push:
    branches: [ fix/plugin-program-recall ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Patch intrin.h include (not available on macOS)
        run: |
          grep -rlE --include='*.h' --include='*.cpp' --include='*.inl' '#include <intrin.h>' external/dsp56300 | while read -r f; do
            perl -0pi -e 's|#include <intrin.h>|#if defined(_MSC_VER)\n#include <intrin.h>\n#elif defined(__x86_64__)\n#include <x86intrin.h>\n#endif|g' "$f"
            echo "patched $f"
          done || true

      - name: Configure
        run: cmake -S . -B build_vst -DCMAKE_BUILD_TYPE=Release -DMS2K_BUILD_VST3=ON

      - name: Find plugin target
        id: tgt
        run: |
          name=$(cmake --build build_vst --target help | grep -o '[A-Za-z0-9_]*_VST3' | head -1)
          echo "Target: $name"
          [ -n "$name" ] || { echo "No *_VST3 target found"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cmake --build build_vst --config Release --target ${{ steps.tgt.outputs.name }} --parallel

      - name: Package .vst3
        run: |
          bundle=$(find build_vst -type d -name "*.vst3" | head -1)
          [ -n "$bundle" ] || { echo "No .vst3 bundle found"; exit 1; }
          mkdir -p out
          ditto -c -k --keepParent "$bundle" "out/MS2000R-vst3-macos-arm64.zip"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: MS2000R-VST3-macOS-arm64
          path: out
          if-no-files-found: error
