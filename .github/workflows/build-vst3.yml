name: Build Windows VST3

on:
  push:
    branches: [ fix/plugin-program-recall ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (VST3 on, vcpkg off)
        shell: pwsh
        run: |
          Remove-Item Env:VCPKG_ROOT -ErrorAction SilentlyContinue
          cmake -S . -B build_vst -G "Visual Studio 17 2022" -A x64 -DMS2K_BUILD_VST3=ON

      - name: Find plugin target
        id: tgt
        shell: pwsh
        run: |
          $p = Get-ChildItem build_vst -Recurse -Filter "*_VST3.vcxproj" | Select-Object -First 1
          if (-not $p) { Write-Error "No *_VST3 target found"; exit 1 }
          $name = $p.BaseName
          Write-Host "Target: $name"
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: |
          Remove-Item Env:VCPKG_ROOT -ErrorAction SilentlyContinue
          cmake --build build_vst --config Release --target ${{ steps.tgt.outputs.name }} --parallel

      - name: Collect .vst3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem build_vst -Recurse -Directory -Filter "*.vst3" |
            Where-Object { $_.FullName -notmatch '\\Contents\\' } |
            ForEach-Object { Copy-Item $_.FullName out -Recurse -Force }
          Get-ChildItem build_vst -Recurse -File -Filter "*.vst3" |
            ForEach-Object { Copy-Item $_.FullName out -Force }
          Get-ChildItem out -Recurse | Select-Object FullName

      - uses: actions/upload-artifact@v4
        with:
          name: MS2000R-VST3-Windows
          path: out
          if-no-files-found: error
